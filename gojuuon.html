<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="50음도 테스트">
<meta name="theme-color" content="#6366f1">
<title>일본어 50음도 읽기 테스트</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Noto+Sans+KR:wght@400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overflow: hidden; }
  body {
    font-family: 'Noto Sans KR', sans-serif;
    background: #f8f7ff; color: #1a1a2e;
    display: flex; flex-direction: column; align-items: center;
    max-width: 480px; margin: 0 auto; height: 100dvh;
  }

  /* topbar */
  #topbar {
    width: 100%; background: #fff;
    padding: 10px 14px 8px;
    display: flex; align-items: center; gap: 8px;
    border-bottom: 1px solid #ede9fe; flex-shrink: 0;
  }
  #mode-toggle {
    display: flex; background: #ede9fe; border-radius: 99px; padding: 3px; gap: 2px;
  }
  .toggle-btn {
    padding: 5px 14px; border-radius: 99px; border: none;
    font-size: 13px; font-weight: 500; cursor: pointer;
    font-family: 'Noto Sans KR', sans-serif;
    background: transparent; color: #7c3aed;
    transition: background 0.2s, color 0.2s;
  }
  .toggle-btn.active { background: #7c3aed; color: #fff; }
  #progress-wrap {
    flex: 1; height: 8px; background: #ede9fe;
    border-radius: 99px; overflow: hidden;
  }
  #progress-bar {
    height: 100%; background: linear-gradient(90deg, #818cf8, #7c3aed);
    border-radius: 99px; transition: width 0.5s cubic-bezier(.4,0,.2,1); width: 0%;
  }
  #combo-badge {
    font-size: 12px; font-weight: 500; color: #5b21b6; background: #ede9fe;
    border-radius: 99px; padding: 3px 10px; display: none; white-space: nowrap;
  }
  #stats-btn {
    background: none; border: none; font-size: 20px; cursor: pointer; padding: 2px; flex-shrink: 0;
  }

  /* scroll */
  #scroll-area { flex: 1; overflow-y: auto; width: 100%; padding: 0 0 120px; -webkit-overflow-scrolling: touch; }
  #inner { padding: 12px 16px 0; display: flex; flex-direction: column; align-items: center; gap: 10px; }

  /* score */
  #score-display { display: flex; gap: 16px; align-self: flex-start; }
  .score-item { font-size: 13px; color: #888; }
  .score-item span { font-weight: 500; color: #1a1a2e; }

  /* row selector */
  #row-selector {
    width: 100%; display: flex; flex-wrap: wrap; gap: 6px;
  }
  .row-btn {
    flex: 1; min-width: 52px; padding: 7px 4px;
    background: #fff; border: 1px solid #ede9fe;
    border-radius: 10px; font-size: 12px; font-weight: 500;
    color: #7c3aed; cursor: pointer; text-align: center;
    font-family: 'Noto Sans JP', sans-serif;
    transition: background 0.15s, border-color 0.15s;
  }
  .row-btn.active { background: #7c3aed; color: #fff; border-color: #7c3aed; }
  .row-btn.passed { background: #f0fdf4; border-color: #4ade80; color: #15803d; }
  #all-btn {
    width: 100%; padding: 8px;
    background: #fff; border: 1px solid #ede9fe;
    border-radius: 10px; font-size: 12px; font-weight: 500;
    color: #7c3aed; cursor: pointer; text-align: center;
    font-family: 'Noto Sans KR', sans-serif;
    transition: background 0.15s;
  }
  #all-btn.active { background: #7c3aed; color: #fff; border-color: #7c3aed; }

  /* instruction */
  #instruction { font-size: 16px; font-weight: 500; color: #1a1a2e; align-self: flex-start; }

  /* card */
  #card-area { width: 100%; position: relative; height: 170px; }
  .shadow-card { position: absolute; width: 100%; height: 152px; background: #ddd8fe; border-radius: 20px; }
  .shadow-card:nth-child(1) { top: 8px; opacity: 0.5; transform: scale(0.97); }
  .shadow-card:nth-child(2) { top: 4px; opacity: 0.7; transform: scale(0.985); }
  #main-card {
    position: absolute; top: 0; left: 0; width: 100%; height: 152px;
    background: #fff; border-radius: 20px; border: 1px solid #ede9fe;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
    transition: transform 0.35s cubic-bezier(.4,0,.2,1), background 0.3s, border-color 0.3s;
  }
  #main-card.correct { background: #f0fdf4; border-color: #86efac; }
  #main-card.wrong   { background: #fef2f2; border-color: #fca5a5; }
  #main-card.fly-left { transform: translateX(-130%) rotate(-12deg); opacity: 0; }
  #card-row-label {
    position: absolute; top: 10px; right: 12px;
    font-size: 11px; color: #a78bfa; background: #f5f3ff;
    border-radius: 99px; padding: 2px 8px;
  }
  #char-main {
    font-size: 80px; font-weight: 400; color: #1a1a2e;
    font-family: 'Noto Sans JP', sans-serif;
    line-height: 1; text-align: center;
  }
  #char-romaji { font-size: 12px; color: #c4b5fd; letter-spacing: 0.06em; display: none; }
  #speak-btn {
    margin-top: 2px; background: none; border: 1.5px solid #c4b5fd;
    border-radius: 99px; padding: 4px 12px;
    font-size: 12px; color: #7c3aed; cursor: pointer;
    display: none; align-items: center; gap: 6px;
    font-family: 'Noto Sans KR', sans-serif;
  }
  #speak-btn.visible { display: flex; }
  #speak-btn.wrong-speak { border-color: #fecaca; color: #b91c1c; }

  /* choices */
  #choices { width: 100%; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .choice-btn {
    width: 100%; padding: 13px 8px; background: #fff;
    border: 1px solid #ede9fe; border-radius: 12px;
    font-size: 16px; font-weight: 500; color: #1a1a2e; cursor: pointer; text-align: center;
    font-family: 'Noto Sans KR', sans-serif; letter-spacing: 0.04em;
    transition: background 0.15s, border-color 0.15s, transform 0.1s;
  }
  .choice-btn:active:not(:disabled) { transform: scale(0.97); }
  .choice-btn.correct-ans { background: #dcfce7; border-color: #4ade80; color: #15803d; }
  .choice-btn.wrong-ans   { background: #fee2e2; border-color: #f87171; color: #b91c1c; }
  .choice-btn:disabled { cursor: default; }

  /* result bar */
  #result-bar {
    position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
    width: 100%; max-width: 480px;
    padding: 14px 16px calc(14px + env(safe-area-inset-bottom));
    display: none; flex-direction: column; gap: 10px; z-index: 10;
  }
  #result-bar.show { display: flex; }
  #result-bar.correct-bar { background: #f0fdf4; border-top: 2px solid #4ade80; }
  #result-bar.wrong-bar   { background: #fef2f2; border-top: 2px solid #f87171; }
  #result-label { font-size: 16px; font-weight: 500; }
  #result-bar.correct-bar #result-label { color: #15803d; }
  #result-bar.wrong-bar   #result-label { color: #b91c1c; }
  #result-sub { font-size: 13px; color: #555; font-family: 'Noto Sans JP', sans-serif; }
  #continue-btn {
    width: 100%; padding: 14px; border-radius: 14px; border: none;
    font-size: 16px; font-weight: 500; cursor: pointer;
    font-family: 'Noto Sans KR', sans-serif; transition: transform 0.1s;
  }
  #continue-btn:active { transform: scale(0.97); }
  #result-bar.correct-bar #continue-btn { background: #22c55e; color: #fff; }
  #result-bar.wrong-bar   #continue-btn { background: #ef4444; color: #fff; }

  /* stats panel */
  .fs-panel {
    position: fixed; top: 0; left: 50%; transform: translateX(-50%);
    width: 100%; max-width: 480px; height: 100dvh;
    background: #f8f7ff; z-index: 20; display: none; flex-direction: column; overflow-y: auto;
  }
  .fs-panel.open { display: flex; }
  .panel-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px; background: #fff; border-bottom: 1px solid #ede9fe; flex-shrink: 0;
  }
  .panel-title { font-size: 17px; font-weight: 500; }
  .panel-close { background: none; border: none; font-size: 20px; color: #888; cursor: pointer; padding: 4px 8px; }
  #stats-today {
    margin: 16px; background: #fff; border-radius: 16px;
    border: 1px solid #ede9fe; padding: 20px; text-align: center;
  }
  .stats-big-label { font-size: 13px; color: #888; margin-bottom: 8px; }
  .stats-big-num { font-size: 36px; font-weight: 500; color: #7c3aed; }
  .stats-big-sub { font-size: 13px; color: #888; margin-top: 4px; }
  #stats-list { padding: 0 16px 16px; display: flex; flex-direction: column; gap: 8px; }
  .stats-row {
    background: #fff; border-radius: 12px; border: 1px solid #ede9fe;
    padding: 12px 16px; display: flex; align-items: center; justify-content: space-between;
  }
  .stats-date { font-size: 14px; color: #555; }
  .stats-right { display: flex; gap: 10px; align-items: center; }
  .stats-correct { font-size: 15px; font-weight: 500; color: #7c3aed; }
  .stats-total { font-size: 13px; color: #aaa; }
  .stats-bar-wrap { width: 50px; height: 6px; background: #ede9fe; border-radius: 99px; overflow: hidden; }
  .stats-bar-fill { height: 100%; background: #7c3aed; border-radius: 99px; }
</style>
</head>
<body>

<!-- 통계 패널 -->
<div id="stats-panel" class="fs-panel">
  <div class="panel-header">
    <span class="panel-title">학습 기록</span>
    <button class="panel-close" onclick="toggleStats()">✕</button>
  </div>
  <div id="stats-today">
    <div class="stats-big-label">오늘 학습</div>
    <div class="stats-big-num"><span id="today-correct">0</span>개 정답</div>
    <div class="stats-big-sub"><span id="today-total">0</span>문제 풀이</div>
  </div>
  <div id="stats-list"></div>
</div>

<!-- 탑바 -->
<div id="topbar">
  <div id="mode-toggle">
    <button class="toggle-btn active" onclick="setScript('hiragana', this)">히라가나</button>
    <button class="toggle-btn" onclick="setScript('katakana', this)">가타카나</button>
  </div>
  <div id="progress-wrap"><div id="progress-bar"></div></div>
  <div id="combo-badge">콤보 x<span id="combo-num">0</span></div>
  <button id="stats-btn" onclick="toggleStats()">📊</button>
</div>

<!-- 메인 -->
<div id="scroll-area">
  <div id="inner">
    <div id="score-display">
      <div class="score-item">정답 <span id="correct-count">0</span></div>
      <div class="score-item">오답 <span id="wrong-count">0</span></div>
      <div class="score-item">연속 <span id="streak-count">0</span> 🔥</div>
    </div>

    <!-- 행 선택 -->
    <div id="row-selector"></div>

    <div id="instruction">읽기를 고르세요</div>

    <div id="card-area">
      <div class="shadow-card"></div>
      <div class="shadow-card"></div>
      <div id="main-card">
        <div id="card-row-label"></div>
        <div id="char-main">?</div>
        <div id="char-romaji"></div>
        <button id="speak-btn" onclick="speakChar()">🔊 듣기</button>
      </div>
    </div>

    <div id="choices"></div>
  </div>
</div>

<!-- 결과 바 -->
<div id="result-bar">
  <div>
    <div id="result-label">완벽해요!</div>
    <div id="result-sub"></div>
  </div>
  <button id="continue-btn" onclick="nextQuestion()">계속하기</button>
</div>

<script>
/* ── 50음도 데이터 ── */
const ROWS = [
  { name:'あ행', romaji_row:'a',  hira:['あ','い','う','え','お'], kata:['ア','イ','ウ','エ','オ'], readings:['a','i','u','e','o'] },
  { name:'か행', romaji_row:'ka', hira:['か','き','く','け','こ'], kata:['カ','キ','ク','ケ','コ'], readings:['ka','ki','ku','ke','ko'] },
  { name:'さ행', romaji_row:'sa', hira:['さ','し','す','せ','そ'], kata:['サ','シ','ス','セ','ソ'], readings:['sa','shi','su','se','so'] },
  { name:'た행', romaji_row:'ta', hira:['た','ち','つ','て','と'], kata:['タ','チ','ツ','テ','ト'], readings:['ta','chi','tsu','te','to'] },
  { name:'な행', romaji_row:'na', hira:['な','に','ぬ','ね','の'], kata:['ナ','ニ','ヌ','ネ','ノ'], readings:['na','ni','nu','ne','no'] },
  { name:'は행', romaji_row:'ha', hira:['は','ひ','ふ','へ','ほ'], kata:['ハ','ヒ','フ','ヘ','ホ'], readings:['ha','hi','fu','he','ho'] },
  { name:'ま행', romaji_row:'ma', hira:['ま','み','む','め','も'], kata:['マ','ミ','ム','メ','モ'], readings:['ma','mi','mu','me','mo'] },
  { name:'や행', romaji_row:'ya', hira:['や','ゆ','よ'],           kata:['ヤ','ユ','ヨ'],           readings:['ya','yu','yo'] },
  { name:'ら행', romaji_row:'ra', hira:['ら','り','る','れ','ろ'], kata:['ラ','リ','ル','レ','ロ'], readings:['ra','ri','ru','re','ro'] },
  { name:'わ행', romaji_row:'wa', hira:['わ','を','ん'],           kata:['ワ','ヲ','ン'],           readings:['wa','wo','n'] },
  { name:'탁음', romaji_row:'voiced', hira:['が','ぎ','ぐ','げ','ご','ざ','じ','ず','ぜ','ぞ','だ','ぢ','づ','で','ど','ば','び','ぶ','べ','ぼ'], kata:['ガ','ギ','グ','ゲ','ゴ','ザ','ジ','ズ','ゼ','ゾ','ダ','ヂ','ヅ','デ','ド','バ','ビ','ブ','ベ','ボ'], readings:['ga','gi','gu','ge','go','za','ji','zu','ze','zo','da','di','du','de','do','ba','bi','bu','be','bo'] },
  { name:'반탁음', romaji_row:'p', hira:['ぱ','ぴ','ぷ','ぺ','ぽ'], kata:['パ','ピ','プ','ペ','ポ'], readings:['pa','pi','pu','pe','po'] },
];

/* 모든 글자 flat 배열 만들기 */
function buildFlat(script) {
  var all = [];
  ROWS.forEach(function(row, ri) {
    var chars = script === 'hiragana' ? row.hira : row.kata;
    chars.forEach(function(ch, ci) {
      all.push({ char: ch, reading: row.readings[ci], row: row.name, rowIdx: ri });
    });
  });
  return all;
}

const AZURE_TTS_KEY = '5XbJOlqvU3C0FXeQfZRfHKS5WyEDftcwYqj1eNOV2UJIXqMGSic2JQQJ99CFACNns7RXJ3w3AAAYACOGXTYP';
const AZURE_REGION  = 'koreacentral';

/* ── 상태 ── */
var script = 'hiragana';       // 'hiragana' | 'katakana'
var selectedRows = null;       // null = 전체
var CHARS = buildFlat('hiragana');
var currentChar = null;
var currentChoices = [];
var answered = false;
var combo = 0, correctCount = 0, wrongCount = 0, streakCount = 0;
var usedChars = [], totalShown = 0;

/* ── 저장소 ── */
function getToday() { return new Date().toISOString().slice(0, 10); }
function loadStats() { try { return JSON.parse(localStorage.getItem('gojuuon_stats') || '{}'); } catch(e) { return {}; } }
function saveStats(s) { localStorage.setItem('gojuuon_stats', JSON.stringify(s)); }
function recordAnswer(ok) {
  var stats = loadStats(); var today = getToday();
  if (!stats[today]) stats[today] = { correct: 0, total: 0 };
  stats[today].total++;
  if (ok) stats[today].correct++;
  saveStats(stats);
}

/* ── TTS ── */
async function speakChar(txt) {
  var ch = txt || currentChar.char;
  try {
    var tokenRes = await fetch('https://' + AZURE_REGION + '.api.cognitive.microsoft.com/sts/v1.0/issueToken',
      { method: 'POST', headers: { 'Ocp-Apim-Subscription-Key': AZURE_TTS_KEY } });
    var token = await tokenRes.text();
    var ssml = "<speak version='1.0' xml:lang='ja-JP'><voice name='ja-JP-NanamiNeural'>" + ch + "</voice></speak>";
    var audioRes = await fetch('https://' + AZURE_REGION + '.tts.speech.microsoft.com/cognitiveservices/v1', {
      method: 'POST',
      headers: { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/ssml+xml', 'X-Microsoft-OutputFormat': 'audio-16khz-128kbitrate-mono-mp3' },
      body: ssml
    });
    var blob = await audioRes.blob();
    new Audio(URL.createObjectURL(blob)).play();
  } catch(e) { console.error('TTS error:', e); }
}

/* ── 스크립트 전환 ── */
function setScript(s, el) {
  script = s;
  document.querySelectorAll('.toggle-btn').forEach(function(b) { b.classList.remove('active'); });
  el.classList.add('active');
  selectedRows = null;
  CHARS = buildFlat(script);
  usedChars = []; totalShown = 0;
  correctCount = 0; wrongCount = 0; streakCount = 0; combo = 0;
  updateCombo(); updateScore();
  renderRowSelector();
  loadQuestion();
}

/* ── 행 선택 ── */
function renderRowSelector() {
  var container = document.getElementById('row-selector');
  var allBtn = '<button id="all-btn" class="' + (selectedRows === null ? 'active' : '') + '" onclick="selectAllRows()">전체 (' + CHARS.length + '자)</button>';
  var rowBtns = ROWS.map(function(row, i) {
    var chars = script === 'hiragana' ? row.hira : row.kata;
    var isActive = selectedRows && selectedRows.includes(i);
    return '<button class="row-btn ' + (isActive ? 'active' : '') + '" onclick="toggleRow(' + i + ')">'
      + chars[0] + '~<br><span style="font-size:10px;font-family:\'Noto Sans KR\',sans-serif;">' + row.name + '</span>'
      + '</button>';
  }).join('');
  container.innerHTML = allBtn + '<div style="display:flex;flex-wrap:wrap;gap:6px;width:100%;">' + rowBtns + '</div>';
}

function selectAllRows() {
  selectedRows = null;
  CHARS = buildFlat(script);
  usedChars = []; totalShown = 0;
  renderRowSelector();
  loadQuestion();
}

function toggleRow(idx) {
  if (!selectedRows) selectedRows = [];
  var pos = selectedRows.indexOf(idx);
  if (pos === -1) selectedRows.push(idx);
  else { selectedRows.splice(pos, 1); if (selectedRows.length === 0) { selectedRows = null; } }

  if (selectedRows) {
    var all = buildFlat(script);
    CHARS = all.filter(function(c) { return selectedRows.includes(c.rowIdx); });
    if (CHARS.length === 0) { selectedRows = null; CHARS = buildFlat(script); }
  } else {
    CHARS = buildFlat(script);
  }
  usedChars = []; totalShown = 0;
  renderRowSelector();
  loadQuestion();
}

/* ── 보기 생성 ── */
function getRandomReadings(exclude, n) {
  var allReadings = [];
  ROWS.forEach(function(row) { row.readings.forEach(function(r) { if (r !== exclude) allReadings.push(r); }); });
  /* 중복 제거 */
  allReadings = allReadings.filter(function(r, i, a) { return a.indexOf(r) === i; });
  return allReadings.sort(function() { return Math.random() - 0.5; }).slice(0, n);
}

/* ── 게임 로직 ── */
function loadQuestion() {
  answered = false;
  document.getElementById('result-bar').className = '';
  document.getElementById('result-bar').style.display = 'none';
  document.getElementById('main-card').className = '';
  document.getElementById('char-romaji').style.display = 'none';
  document.getElementById('speak-btn').className = '';

  if (usedChars.length >= CHARS.length) usedChars = [];
  var pool = CHARS.filter(function(c) { return !usedChars.some(function(u) { return u.char === c.char; }); });
  if (pool.length === 0) { usedChars = []; pool = CHARS.slice(); }
  currentChar = pool[Math.floor(Math.random() * pool.length)];
  usedChars.push(currentChar);
  totalShown++;
  updateProgress();

  /* 보기 4개: 정답 + 오답 3개 */
  var wrongReadings = getRandomReadings(currentChar.reading, 3);
  currentChoices = [currentChar.reading].concat(wrongReadings).sort(function() { return Math.random() - 0.5; });

  renderCard();
  renderChoices();
}

function renderCard() {
  document.getElementById('char-main').textContent = currentChar.char;
  document.getElementById('card-row-label').textContent = currentChar.row;
}

function renderChoices() {
  var c = document.getElementById('choices');
  c.innerHTML = '';
  currentChoices.forEach(function(reading) {
    var btn = document.createElement('button');
    btn.className = 'choice-btn';
    btn.textContent = reading;
    btn.onclick = function() { handleAnswer(reading, btn); };
    c.appendChild(btn);
  });
}

function handleAnswer(chosen, btn) {
  if (answered) return;
  answered = true;
  var isCorrect = chosen === currentChar.reading;

  document.querySelectorAll('.choice-btn').forEach(function(b) {
    b.disabled = true;
    if (b.textContent === currentChar.reading) b.classList.add('correct-ans');
    else if (b.textContent === chosen && !isCorrect) b.classList.add('wrong-ans');
  });

  var card = document.getElementById('main-card');
  var rb = document.getElementById('result-bar');

  if (isCorrect) {
    combo++; streakCount++; correctCount++;
    recordAnswer(true);
    card.classList.add('correct');
    rb.className = 'show correct-bar';
    document.getElementById('result-label').textContent = combo >= 5 ? '콤보 x' + combo + '! 완벽해요!' : '완벽해요!';
    document.getElementById('result-sub').textContent = currentChar.char + ' = ' + currentChar.reading;
    speakChar();
    var sb = document.getElementById('speak-btn');
    sb.className = 'visible'; sb.textContent = '🔊 다시 듣기';
  } else {
    combo = 0; streakCount = 0; wrongCount++;
    recordAnswer(false);
    card.classList.add('wrong');
    rb.className = 'show wrong-bar';
    document.getElementById('result-label').textContent = '틀렸어요';
    document.getElementById('result-sub').textContent = '정답: ' + currentChar.char + ' = ' + currentChar.reading;
    speakChar();
    var sb2 = document.getElementById('speak-btn');
    sb2.className = 'visible wrong-speak'; sb2.textContent = '🔊 정답 듣기';
  }

  var romaEl = document.getElementById('char-romaji');
  romaEl.textContent = currentChar.reading;
  romaEl.style.display = 'block';

  rb.style.display = 'flex';
  updateCombo(); updateScore();
}

function nextQuestion() {
  var card = document.getElementById('main-card');
  card.classList.add('fly-left');
  setTimeout(function() { card.classList.remove('fly-left'); loadQuestion(); }, 350);
}

function updateProgress() {
  document.getElementById('progress-bar').style.width = Math.min((totalShown % CHARS.length) / CHARS.length * 100, 100) + '%';
}
function updateCombo() {
  document.getElementById('combo-num').textContent = combo;
  document.getElementById('combo-badge').style.display = combo >= 3 ? 'block' : 'none';
}
function updateScore() {
  document.getElementById('correct-count').textContent = correctCount;
  document.getElementById('wrong-count').textContent   = wrongCount;
  document.getElementById('streak-count').textContent  = streakCount;
}

/* ── 통계 ── */
function toggleStats() {
  var p = document.getElementById('stats-panel');
  if (p.classList.contains('open')) { p.classList.remove('open'); }
  else { renderStats(); p.classList.add('open'); }
}
function renderStats() {
  var stats = loadStats(); var today = getToday();
  var todayData = stats[today] || { correct: 0, total: 0 };
  document.getElementById('today-correct').textContent = todayData.correct;
  document.getElementById('today-total').textContent   = todayData.total;
  var days = Object.keys(stats).sort(function(a,b) { return b.localeCompare(a); });
  document.getElementById('stats-list').innerHTML = days.length === 0
    ? '<div style="text-align:center;color:#aaa;font-size:14px;padding:20px">아직 기록이 없어요</div>'
    : days.map(function(day) {
        var d = stats[day];
        var pct = d.total > 0 ? Math.round(d.correct / d.total * 100) : 0;
        var label = day === today ? '오늘' : day.slice(5).replace('-', '/');
        return '<div class="stats-row"><div class="stats-date">' + label + '</div>'
          + '<div class="stats-right"><div class="stats-bar-wrap"><div class="stats-bar-fill" style="width:' + pct + '%"></div></div>'
          + '<div class="stats-correct">' + d.correct + '정답</div>'
          + '<div class="stats-total">' + d.total + '문제</div></div></div>';
      }).join('');
}

/* ── 초기화 ── */
renderRowSelector();
loadQuestion();
</script>
</body>
</html>
